name: Publikacja na GitHub Pages

# Każdy push na main = nowa wersja aplikacji na wszystkich urządzeniach.
# Telefon/tablet/komputer pobiorą ją same przy następnym otwarciu.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Akademia jest teraz działem Ligi (projekt-os-02). Pod tym adresem stoi
      # już tylko przekierowanie (redirect/): strona, która przenosi każdy
      # dawny adres na ten sam w Lidze, oraz sw.js sprzątający dawny service
      # worker Akademii. Kod Akademii zostaje w repozytorium jako historia;
      # powrót do osobnej aplikacji = tag przed-polaczeniem (docs Ligi:
      # docs/polaczenie.md).
      - name: Strona przekierowania
        run: |
          mkdir -p out
          cp redirect/index.html redirect/sw.js out/
          cp redirect/index.html out/404.html

      # Pages muszą być już włączone w ustawieniach repozytorium (źródło:
      # GitHub Actions). Token workflow nie ma prawa włączyć ich sam.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
